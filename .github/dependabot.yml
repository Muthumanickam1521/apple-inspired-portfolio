# Weekly dependency update PRs. Minor and patch bumps are grouped into one PR
# per ecosystem; major bumps arrive as their own PRs. CI tests each one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 breaks `next build` and `tsc` (Next.js 15 isn't compatible yet).
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
