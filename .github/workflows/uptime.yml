name: Uptime check

# Pings the live site every 30 minutes. If it is down, opens a "site-down"
# issue (one at a time); when it is back up, closes that issue.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  issues: write

env:
  SITE_URL: https://www.muthumanickam.tech
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check site
        id: check
        run: |
          status=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 20 --retry 2 --retry-delay 10 "$SITE_URL" || echo 000)
          echo "Status: $status"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Open issue if down
        if: steps.check.outputs.status != '200'
        run: |
          open=$(gh issue list --label site-down --state open --json number --jq 'length')
          if [ "$open" = "0" ]; then
            gh label create site-down --color B60205 --description "Uptime check failed" 2>/dev/null || true
            gh issue create --label site-down \
              --title "Site is down ($SITE_URL)" \
              --body "The uptime check got HTTP ${{ steps.check.outputs.status }} from $SITE_URL. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          exit 1

      - name: Close issue if back up
        if: steps.check.outputs.status == '200'
        run: |
          for n in $(gh issue list --label site-down --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Site is back up (HTTP 200)."
          done
